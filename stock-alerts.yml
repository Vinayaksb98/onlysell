name: Automatic Telegram Intraday Short Alerts

on:
  schedule:
    # GitHub cron uses UTC. Every 15 minutes, Monday-Friday, during India market hours.
    - cron: "*/15 4-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-intraday-short-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Scan Nifty 500 and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u alert.py
